# LOCAL DEVELOPMENT PREVIEW ONLY: 127.0.0.1; never a public endpoint.
services:
  notebook-api:
    build:
      context: .
      dockerfile: Containerfile
    image: localhost/goreecloud-notebook:local-preview
    user: "10001:10001"
    read_only: true
    tmpfs:
      - "/tmp:rw,noexec,nosuid,nodev,size=16m"
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    pids_limit: 128
    mem_limit: 512m
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      GC_NOTEBOOK_TOKEN: "${GC_NOTEBOOK_TOKEN:?Export a unique random local token of at least 24 characters}"
      GC_NOTEBOOK_DB: /data/notes.sqlite3
      GC_NOTEBOOK_ORIGINS: "http://127.0.0.1:5173,http://localhost:5173"
    volumes:
      - notebook-dev-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=2).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: "no"
volumes:
  notebook-dev-data:
