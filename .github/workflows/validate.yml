name: Notebook foundation validation
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax checks
        run: npm run check
      - name: Model unit tests
        run: npm test
      - name: Validate documentation and license
        run: |
          test -s LICENSE
          test -s README.md
          test -s docs/IMPLEMENTED-FEATURES.md
          test -s docs/PLANNED-FEATURES.md
          test -s docs/COMPETITIVE-OBJECTIVES.md
