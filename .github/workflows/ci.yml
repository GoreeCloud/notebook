name: Notebook validation
on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  api:
    name: API / SQLite tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r server/requirements-dev.txt
      - run: PYTHONPATH=server pytest -q server/tests
  web:
    name: React build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "24", cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
  linux:
    name: Qt Quick 6.12 smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0
      - run: python -m pip install -r linux/requirements.txt
      - run: QT_QPA_PLATFORM=offscreen GC_NOTEBOOK_SMOKE=1 python linux/main.py
  android:
    name: Android debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "21"}
      - name: Install Android SDK 37
        run: sdkmanager --install "platforms;android-37" "build-tools;36.0.0"
      - run: chmod +x gradlew && ./gradlew :app:assembleDebug --no-daemon
        working-directory: android
