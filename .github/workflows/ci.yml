name: Notebook validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  api:
    name: API / SQLite tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 (node24)
        with: {python-version: "3.12"}
      - run: python -m pip install -r server/requirements-dev.txt
      - run: python -m pip install -r server/requirements-crypto.txt
      - run: PYTHONPATH=server pytest -q server/tests
  web:
    name: React build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (node24)
        with: {node-version: "24", cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
  linux:
    name: Qt Quick 6.12 smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 (node24)
        with: {python-version: "3.12"}
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0
      - run: python -m pip install -r linux/requirements.txt
      - run: QT_QPA_PLATFORM=offscreen GC_NOTEBOOK_SMOKE=1 python linux/main.py
      - run: QT_QPA_PLATFORM=offscreen python -m unittest discover -s linux/tests -v
      - name: Build unsigned local Linux Debian package (do not publish binaries)
        run: python scripts/build_linux_deb.py --output "${{ runner.temp }}/goreecloud-notebook_0.1.0~dev1_amd64.deb"
      - name: Extract and smoke native Qt package using disposable data
        run: bash scripts/smoke_linux_deb.sh "${{ runner.temp }}/goreecloud-notebook_0.1.0~dev1_amd64.deb"
  android:
    name: Android debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      # Official MIT action v6.3.0, pinned to reviewed Node 24 commit.
      # Keep Java compiler annotations enabled (new v6 default is false).
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0 (node24)
        with: {distribution: temurin, java-version: "21", problem-matcher: true}
      # Official GitHub MIT cache action, pinned to reviewed Node 24 v6.1.0.
      # Cache ONLY public Gradle dependency artifacts and wrapper distributions.
      # No configuration-cache, credentials, build output, or user data.
      - name: Cache public Android Gradle dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: notebook-android-gradle-${{ runner.os }}-v1-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/settings.gradle.kts', 'android/build.gradle.kts', 'android/app/build.gradle.kts') }}
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4 (node24)
        with:
          packages: 'platform-tools'
      - name: Install Android SDK 37
        run: sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0"
      - run: chmod +x gradlew && ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace
        working-directory: android
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (node24)
        with:
          name: goreecloud-notebook-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
