name: GoreeCloud Notebook Source Integrity

on:
  push:
    branches:
      - 'feat/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate derived-repository foundation
        run: python3 -m unittest discover -s scripts/goreecloud -p 'test_*.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate local Evernote file-review rules
        run: node --experimental-strip-types --test apps/client/src/widgets/dialogs/import/evernote_preflight.test.mjs
