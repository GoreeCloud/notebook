name: GoreeCloud Notebook Source Integrity

on:
  push:
    branches:
      - 'feat/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate derived-repository foundation
        run: python3 -m unittest discover -s scripts/goreecloud -p 'test_*.py' -v
