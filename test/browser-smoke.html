<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>GoreeCloud Notebook browser smoke test</title>
<body data-smoke="running"><h1>Notebook browser smoke test</h1><pre id="output">Running…</pre></body>
<script type="module">
import { readState, writeState, readRecoveryState, replaceStateWithRecovery } from "../src/storage.js";
import { SCHEMA_VERSION, makeNote } from "../src/model.js";

const out = document.getElementById("output");
const check = (condition, description) => { if (!condition) throw new Error(description); };
const delay = ms => new Promise(resolve => setTimeout(resolve, ms));
async function until(fn, timeout = 8000) {
  const started = Date.now();
  while (Date.now() - started < timeout) {
    const value = await fn();
    if (value) return value;
    await delay(100);
  }
  throw new Error("Timed out waiting for browser check");
}
function finish(ok, details) {
  document.documentElement.dataset.testResult = ok ? "PASS" : "FAIL";
  document.body.dataset.smoke = ok ? "passed" : "failed";
  out.textContent = details;
}
try {
  check((await readState()) === null, "Expected clean browser profile");
  check((await readRecoveryState()) === null, "Expected no existing import checkpoint");
  // An app's service worker must not erase other same-origin application caches.
  const unrelatedCache = await caches.open("unrelated-app-test-cache");
  await unrelatedCache.put("./unrelated-test-resource", new Response("preserve"));
  const seed = makeNote({ id: "smoke001", title: "Initial idea" });
  const first = { version: SCHEMA_VERSION, notes: [seed] };
  const rev1 = await writeState(first, 0);
  check(rev1 === 1 && (await readState()).revision === 1, "Initial write revision failed");

  // Simultaneous stale-tab writes: exactly one transaction may win.
  const changes = [1, 2].map(i => writeState({
    version: SCHEMA_VERSION, notes: [{ ...seed, body: "Concurrent change " + i }]
  }, rev1));
  const results = await Promise.allSettled(changes);
  check(results.filter(r => r.status === "fulfilled").length === 1, "Expected one winning write");
  const loss = results.filter(r => r.status === "rejected");
  check(loss.length === 1 && loss[0].reason.code === "NOTEBOOK_STORAGE_CONFLICT",
        "Expected stale writer to report a conflict");
  const saved = await readState();
  check(saved.revision === 2, "Atomic revision should increase once");
  check(saved.notes[0].body.startsWith("Concurrent change "), "Winner content missing");

  // Load the actual application in an iframe and exercise its real UI.
  const frame = document.createElement("iframe");
  frame.title = "Notebook interface test";
  frame.src = "../index.html";
  document.body.append(frame);
  const doc = await until(() => frame.contentDocument?.querySelector(".content.overview") && frame.contentDocument);
  const newButton = doc.querySelector('[data-action="new"]');
  check(Boolean(newButton), "New-note button not rendered");
  newButton.click();
  const title = await until(() => doc.getElementById("noteTitle"));
  title.value = "Browser acceptance note";
  title.dispatchEvent(new Event("input", { bubbles: true }));
  const body = doc.getElementById("noteBody");
  check(Boolean(body), "Note editor missing");
  body.value = "A local-first saved idea [[Initial idea]].";
  body.dispatchEvent(new Event("input", { bubbles: true }));
  const persisted = await until(async () => {
    const snapshot = await readState();
    return snapshot.notes.find(note => note.title === "Browser acceptance note" && note.body.includes("local-first")) && snapshot;
  });
  check(persisted.notes.length === 2, "New note was not persisted");
  const acceptedId = persisted.notes.find(note => note.title === "Browser acceptance note").id;
  doc.querySelector('[data-action="favorite"]').click();
  await until(async () => (await readState()).notes.some(note => note.id === acceptedId && note.favorite));
  doc.querySelector('[data-action="duplicate"]').click();
  await until(async () => (await readState()).notes.some(note =>
    note.id !== acceptedId && note.title === "Copy of Browser acceptance note" && note.body.includes("local-first")));


  // Verify nested notes, visible hierarchy and moving a child to the top level.
  doc.querySelector('[data-note="' + acceptedId + '"]').click();
  doc.querySelector('[data-action="child"]').click();
  const childSnapshot = await until(async () => {
    const snapshot = await readState();
    return snapshot.notes.find(note => note.parentId === acceptedId) && snapshot;
  });
  const childId = childSnapshot.notes.find(note => note.parentId === acceptedId).id;
  check(Boolean(doc.querySelector('.tree-node.depth-1 [data-note="' + childId + '"]')),
    "Nested note does not appear beneath its parent");
  doc.querySelector('[data-note="' + acceptedId + '"]').click();
  check(![...doc.getElementById("parentSelect").options].some(option => option.value === childId),
    "Parent editor offers its descendant as a parent (would create a cycle)");
  doc.querySelector('[data-note="' + childId + '"]').click();
  const move = doc.getElementById("parentSelect");
  move.value = "";
  move.dispatchEvent(new Event("change", { bubbles: true }));
  await until(async () => (await readState()).notes.some(note => note.id === childId && note.parentId === null));

  // Full application search and task controls, not just the pure model.
  const search = doc.getElementById("globalSearch");
  search.value = "Browser acceptance";
  search.dispatchEvent(new Event("input", { bubbles: true }));
  check([...doc.querySelectorAll(".note-list-item")].some(item => item.dataset.note === acceptedId),
        "Searching did not surface the saved note");
  const resetSearch = doc.getElementById("globalSearch");
  resetSearch.value = "";
  resetSearch.dispatchEvent(new Event("input", { bubbles: true }));

  doc.querySelector('[data-action="new-task"]').click();
  const due = doc.getElementById("taskDue");
  check(Boolean(due), "Task due-date control not rendered");
  due.value = "2026-12-15";
  due.dispatchEvent(new Event("change", { bubbles: true }));
  const done = doc.getElementById("taskDone");
  done.checked = true;
  done.dispatchEvent(new Event("change", { bubbles: true }));
  await until(async () => (await readState()).notes.some(note =>
    note.type === "task" && note.completed && note.dueDate === "2026-12-15"));

  // Archive / restore and trash / restore preserve original note ID and body.
  doc.querySelector('[data-note="' + acceptedId + '"]').click();
  doc.querySelector('[data-action="archive"]').click();
  doc.querySelector('[data-view="archive"]').click();
  doc.querySelector('[data-note="' + acceptedId + '"]').click();
  doc.querySelector('[data-action="restore"]').click();
  await until(async () => (await readState()).notes.some(note => note.id === acceptedId && !note.archived));
  doc.defaultView.confirm = () => true;
  doc.querySelector('[data-note="' + acceptedId + '"]').click();
  doc.querySelector('[data-action="trash"]').click();
  doc.querySelector('[data-view="trash"]').click();
  doc.querySelector('[data-note="' + acceptedId + '"]').click();
  doc.querySelector('[data-action="restore"]').click();
  await until(async () => (await readState()).notes.some(note => note.id === acceptedId && !note.trashed));


  // A stable-ID wiki link must display and open the renamed target.
  doc.querySelector('[data-note="smoke001"]').click();
  const renamedInput = doc.getElementById("noteTitle");
  renamedInput.value = "Renamed seed note";
  renamedInput.dispatchEvent(new Event("input", { bubbles: true }));
  doc.querySelector('[data-note="' + acceptedId + '"]').click();
  const referencingBody = doc.getElementById("noteBody");
  referencingBody.value = "See the renamed note [[id:smoke001]].";
  referencingBody.dispatchEvent(new Event("input", { bubbles: true }));
  doc.querySelector('[data-action="preview"]').click();
  const stableLink = doc.querySelector('[data-link="id:smoke001"]');
  check(stableLink?.textContent.includes("Renamed seed note"), "Stable link did not display renamed title");
  stableLink.click();
  check(doc.getElementById("noteTitle")?.value === "Renamed seed note", "Stable link did not open renamed target");
  await until(async () => (await readState()).notes.some(note =>
    note.id === acceptedId && note.body.includes("[[id:smoke001]]")));

  // Reopen the UI in a new page context; persisted edits must survive.
  const second = document.createElement("iframe");
  second.title = "Notebook second tab test";
  second.src = "../index.html";
  document.body.append(second);
  const secondDoc = await until(() => second.contentDocument?.querySelector(".content.overview") && second.contentDocument);
  secondDoc.querySelector('[data-view="notes"]').click();
  check(secondDoc.body.textContent.includes("Browser acceptance note"), "Saved note unavailable after reopen");

  // First tab saves a newer version; stale second tab must show a persistent warning.
  doc.querySelector('[data-note="' + acceptedId + '"]').click();
  const liveBody = doc.getElementById("noteBody");
  liveBody.value = "Changed in first tab after second opened";
  liveBody.dispatchEvent(new Event("input", { bubbles: true }));
  await until(async () => (await readState()).notes.some(note => note.body.includes("Changed in first tab")));
  secondDoc.querySelector('[data-note="smoke001"]').click();
  const secondTitle = secondDoc.getElementById("noteTitle");
  secondTitle.value = "Outdated title";
  secondTitle.dispatchEvent(new Event("input", { bubbles: true }));
  await until(() => secondDoc.querySelector(".save-warning"));
  check((await readState()).notes.some(note => note.body.includes("Changed in first tab")),
        "Conflict incorrectly overwrote newer data");

  // Browser import: validate the file and replace the snapshot atomically.
  const fromBackup = makeNote({ id: "restored1", title: "Restored from backup" });
  fromBackup.body = "My recovered note";
  const backupFile = new doc.defaultView.File(
    [JSON.stringify({ version: SCHEMA_VERSION, notes: [fromBackup] })],
    "notebook-backup.json", { type: "application/json" }
  );
  const data = new doc.defaultView.DataTransfer();
  data.items.add(backupFile);
  const importInput = doc.getElementById("importFile");
  importInput.files = data.files;
  importInput.dispatchEvent(new doc.defaultView.Event("change", { bubbles: true }));
  const imported = await until(async () => {
    const snapshot = await readState();
    return snapshot.notes.length === 1 && snapshot.notes[0].id === "restored1" && snapshot;
  });
  check(imported.notes[0].body === "My recovered note", "Backup restoration lost content");
  const importCheckpoint = await readRecoveryState();
  check(importCheckpoint && importCheckpoint.notes.some(note => note.title === "Browser acceptance note"),
    "Import did not capture the previously saved workspace");
  // Reject malformed backups without replacing a successfully restored workspace.
  const broken = new doc.defaultView.File(
    ['{"version":1,"notes":[{"id":"invalid","body":false}]}'],
    "invalid-backup.json", { type: "application/json" }
  );
  const invalidData = new doc.defaultView.DataTransfer();
  invalidData.items.add(broken);
  const invalidInput = doc.getElementById("importFile");
  invalidInput.files = invalidData.files;
  invalidInput.dispatchEvent(new doc.defaultView.Event("change", { bubbles: true }));
  await until(() => doc.getElementById("toast")?.textContent.includes("Import rejected"));
  const afterRejectedImport = await readState();
  check(afterRejectedImport.revision === imported.revision &&
    afterRejectedImport.notes[0].id === "restored1", "Invalid backup modified stored notes");

  // Confirm the actual Export action serializes the complete restored note.
  let exportedBlob;
  const nativeObjectUrl = doc.defaultView.URL.createObjectURL;
  doc.defaultView.URL.createObjectURL = function(blob) {
    exportedBlob = blob;
    return nativeObjectUrl.call(this, blob);
  };
  doc.querySelector('[data-action="export"]').click();
  check(Boolean(exportedBlob), "Export action did not produce a JSON backup");
  const exportedData = JSON.parse(await exportedBlob.text());
  check(exportedData.version === SCHEMA_VERSION &&
    exportedData.notes[0].id === "restored1" &&
    exportedData.notes[0].body === "My recovered note",
    "Export backup is incomplete");
  doc.defaultView.URL.createObjectURL = nativeObjectUrl;

  // Restore the prior workspace through the settings UI. Undo is itself atomic and reversible.
  doc.querySelector('[data-action="settings"]').click();
  doc.querySelector('[data-action="recover-import"]').click();
  const originalRestored = await until(async () => {
    const snapshot = await readState();
    return snapshot.notes.some(note => note.title === "Browser acceptance note") &&
      !snapshot.notes.some(note => note.id === "restored1") && snapshot;
  });
  check(originalRestored.revision > imported.revision, "Undo did not advance the storage revision");
  const inverseCheckpoint = await readRecoveryState();
  check(inverseCheckpoint?.notes.some(note => note.id === "restored1"),
    "Undo did not retain the just-replaced workspace for another reversal");
  try {
    await replaceStateWithRecovery({ version: SCHEMA_VERSION, notes: [] }, imported.revision);
    throw new Error("Stale import unexpectedly overwrote a newer workspace");
  } catch (error) {
    check(error.code === "NOTEBOOK_STORAGE_CONFLICT", "Stale import failed without a revision-conflict error");
  }
  check((await readState()).revision === originalRestored.revision,
    "Rejected stale import changed the saved workspace");

  // Keyboard navigation and authoring shortcuts must be functional without a pointer.
  doc.dispatchEvent(new doc.defaultView.KeyboardEvent("keydown", {
    key: "k", ctrlKey: true, bubbles: true, cancelable: true
  }));
  check(doc.activeElement?.id === "globalSearch", "Ctrl+K did not focus note search");
  doc.dispatchEvent(new doc.defaultView.KeyboardEvent("keydown", {
    key: "n", ctrlKey: true, bubbles: true, cancelable: true
  }));
  check(Boolean(doc.getElementById("noteTitle")) && doc.activeElement?.id === "noteTitle",
    "Ctrl+N did not create and focus a note");
  doc.dispatchEvent(new doc.defaultView.KeyboardEvent("keydown", {
    key: "s", ctrlKey: true, bubbles: true, cancelable: true
  }));
  await until(async () => (await readState()).notes.length === originalRestored.notes.length + 1);

  // Wait for the service-worker shell installation before the runner emulates offline networking.
  const activeWorker = await Promise.race([
    frame.contentWindow.navigator.serviceWorker.ready.then(registration => registration.active),
    delay(8000).then(() => null)
  ]);
  check(Boolean(activeWorker), "PWA service-worker shell did not become ready");
  check((await caches.keys()).includes("unrelated-app-test-cache"),
    "Notebook service-worker activation removed an unrelated cache");

  finish(true, "PASS: IndexedDB revisions, autosave, favorites, duplication, nested-note relocation, stable links, search, tasks, archive/trash recovery, stale-tab warning, backup import/export/undo, stale replacement rejection, keyboard shortcuts and unrelated-cache isolation.");
} catch (error) {
  console.error(error);
  finish(false, "FAIL: " + (error?.stack || error));
}
</script>
</html>
